# Sitio estático de Nuxt (nuxi generate). Traefik termina TLS; acá solo HTTP.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Assets con hash en el nombre: cache larga.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(webp|png|jpg|ico|svg|woff2|pdf|mjs)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Rutas prerenderizadas: /proyectos/<slug> -> /proyectos/<slug>/index.html
    # Lo que no existe responde 404 con la página de error de Nuxt.
    error_page 404 /404.html;
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
