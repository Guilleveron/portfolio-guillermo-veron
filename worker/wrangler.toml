name = "portfolio-assistant"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Base de conocimiento generada con `npm run knowledge` desde la raíz del repo.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Límite de uso (opcional). Crear con `npx wrangler kv namespace create RL` y pegar el id.
# [[kv_namespaces]]
# binding = "RL"
# id = "REEMPLAZAR_CON_EL_ID_DEL_NAMESPACE"

[vars]
ALLOWED_ORIGINS = "https://guilleveron.com,https://www.guilleveron.com,https://guilleveron.github.io,http://localhost:3200"
# Cascada de modelos: proveedor:modelo separados por coma. Se saltan los que no tienen clave.
LLM_CHAIN = "qwen:qwen-flash,openrouter:google/gemini-2.5-flash-lite,openrouter:inclusionai/ling-3.0-flash,groq:openai/gpt-oss-20b,gemini:gemini-3.7-flash,qwen:qwen3.7-flash,xai:grok-4-fast,anthropic:claude-haiku-5-5"
MAX_PER_HOUR = "20"
MAX_PER_DAY_GLOBAL = "1500"

# Secretos (uno por proveedor, solo los que uses): GEMINI_API_KEY, DASHSCOPE_API_KEY, QWEN_URL,
# GROQ_API_KEY, OPENROUTER_API_KEY, XAI_API_KEY, ANTHROPIC_API_KEY.
# En local van en .dev.vars; en producción: `npx wrangler secret put NOMBRE` o `npm run secrets`.
