# GitHub Pages ya no aloja el sitio: publica una redirección a https://guilleveron.com
# (el portafolio vive en el servidor OVH, ver README "Despliegue en OVH"). Cada ruta vieja
# de /portfolio-guillermo-veron/… salta a la misma ruta en el dominio nuevo.
name: Deploy redirect to Pages

on:
  push:
    branches: ["master"]
    paths: ["pages-redirect/**", ".github/workflows/nuxtjs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
